nameOverride: ""
fullnameOverride: ""

global:
  labels: {}

shopWeb:
  replicaCount: 2
  image:
    repository: devopseasylearning/s3-project01-espresso-shop
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: NodePort
    port: 8090
    nodePort: 30090
  env:
    ProductCatalogUrl: http://espresso-shop-product-catalog-svc:8091
    ReviewsUrl: http://espresso-shop-reviews-svc:8092
  command: []
  args: []
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

shopProduct:
  replicaCount: 2
  image:
    repository: devopseasylearning/s3-project01-espresso-shop-product
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: ClusterIP
    port: 8091
  version: v1
  command: []
  args: []
  resources: {}

shopReviews:
  replicaCount: 2
  image:
    repository: devopseasylearning/s3-project01-espresso-shop-review
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: ClusterIP
    port: 8092
  v1:
    enabled: true
    version: v1
    serviceVersion: v1
  v2:
    enabled: true
    version: v2
    serviceVersion: v2
  command: []
  args: []
  resources: {}

redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: "4.0.2"
    pullPolicy: IfNotPresent
  containerPort: 6379
  service:
    type: ClusterIP
    port: 6379
  resources: {}

postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  containerPort: 5432
  service:
    type: ClusterIP
    port: 5432
  database: espresso
  username: espresso
  password: espresso123
  persistence:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  resources: {}

postgresReplication:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  resources: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: espresso-shop.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
