apiVersion: v1
kind: Service
metadata:
  name: espresso-shop-product-catalog-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "espresso-shop.labels" . | nindent 4 }}
    app: espresso-shop-product-catalog
spec:
  type: {{ .Values.shopProduct.service.type }}
  selector:
    app: espresso-shop-product-catalog
  ports:
    - name: http
      port: {{ .Values.shopProduct.service.port }}
      targetPort: {{ .Values.shopProduct.containerPort }}
      protocol: TCP

