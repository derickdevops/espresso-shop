{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: espresso-shop-redis-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "espresso-shop.labels" . | nindent 4 }}
    app: espresso-shop-redis
spec:
  type: {{ .Values.redis.service.type }}
  selector:
    app: espresso-shop-redis
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.containerPort }}
      protocol: TCP
{{- end }}

